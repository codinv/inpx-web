name: docker-publish

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: |
          Docker image version (required for manual trigger):
          - Use semantic versioning format (e.g., 1.0.0 or v1.0.0)
          - Will be used as image tag
        required: true
        type: string
      tag_latest:
        description: "Also move the :latest tag to this build (UNCHECK for test builds)"
        required: false
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ci-configs
        uses: actions/checkout@v4
        with:
          repository: codinv/ci-configs
          path: ci-configs
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Verify Dockerfile and set vars
        run: |
          PROJECT_NAME=$(basename ${{ github.repository }})
          DOCKERFILE_PATH="ci-configs/$PROJECT_NAME/Dockerfile"
          echo "DOCKERFILE_PATH=$DOCKERFILE_PATH" >> $GITHUB_ENV
          echo "REG_REPO=${{ github.repository_owner }}/$PROJECT_NAME" >> $GITHUB_ENV
          [ -f "$DOCKERFILE_PATH" ] || { echo "::error::Dockerfile not found at path: $DOCKERFILE_PATH"; exit 1; }

      - name: Determine image version
        id: set_version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.build_version }}
          INPUT_LATEST: ${{ github.event.inputs.tag_latest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            if [[ "$INPUT_LATEST" == "true" ]]; then LATEST=true; else LATEST=false; fi
          else
            VERSION="$RELEASE_TAG"
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then LATEST=false; else LATEST=true; fi
          fi
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_LATEST=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION (also tag latest: $LATEST)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REG_REPO }}:${{ steps.set_version.outputs.IMAGE_VERSION }}
            ${{ steps.set_version.outputs.TAG_LATEST == 'true' && format('ghcr.io/{0}:latest', env.REG_REPO) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.repository_url }}
            org.opencontainers.image.version=${{ steps.set_version.outputs.IMAGE_VERSION }}

      - name: Show bundled tool versions
        continue-on-error: true
        env:
          IMAGE_VERSION: ${{ steps.set_version.outputs.IMAGE_VERSION }}
          TAG_LATEST: ${{ steps.set_version.outputs.TAG_LATEST }}
        run: |
          IMAGE="ghcr.io/${REG_REPO}:${IMAGE_VERSION}"
          FBC_VER="$(docker run --rm --entrypoint cat "$IMAGE" /data_init/app-fb2cng/fbc.ver)"
          S2KM_VER="$(docker run --rm --entrypoint cat "$IMAGE" /data_init/app-sync2kindle/s2km.ver)"
          if [[ "$TAG_LATEST" == "true" ]]; then TAGS="${IMAGE_VERSION}, latest"; else TAGS="${IMAGE_VERSION} (latest не менялся)"; fi
          {
            echo "## Образ ${IMAGE}"
            echo ""
            echo "| Компонент | Версия |"
            echo "|---|---|"
            echo "| fb2cng (fbc) | ${FBC_VER} |"
            echo "| sync2kindle (s2km) | ${S2KM_VER} |"
            echo ""
            echo "Теги: ${TAGS}"
            echo ""
            echo "Запись для CHANGELOG.md:"
            echo ""
            echo '```'
            echo "## ${IMAGE_VERSION} ($(date -u +%F))"
            echo "- Включены: fb2cng ${FBC_VER}, sync2kindle ${S2KM_VER}"
            echo "- inpx-web без изменений"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
